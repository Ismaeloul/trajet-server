<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f7f8fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1216">
<meta name="color-scheme" content="light dark">
<title>Trajet</title>

<!-- Instalable en la pantalla de inicio: en el móvil se abre sin barra de
     navegador, a pantalla completa y con su icono, como una app. En iOS hay
     que hacerlo a mano una vez (Compartir → Añadir a pantalla de inicio);
     no hay otra vía sin pasar por el store. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Trajet">
<meta name="application-name" content="Trajet">
<!-- Safari en iOS mira estas, no el manifest, para abrir sin barra. La de
     estado va en 'default': el sistema la pinta él con el texto del color
     que toca (negro de día, blanco de noche). Con 'black-translucent' el
     texto es siempre blanco y sobre una hoja clara no se ve la hora. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- La fuente va en el propio servidor, no en un CDN: la app tiene que
     arrancar sin red y el service worker la guarda con el resto del armazón. -->
<link rel="preload" href="/static/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ============ TABLERO ============ -->
<section id="view-board" class="view active">
  <!-- El scroll empieza arriba del todo: la cabecera se va con el contenido,
       así el tablero gana la altura de una barra fija. -->
  <main id="board-scroll" class="board-scroll">
    <div id="pull" class="pull" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M20 11A8 8 0 1 0 12 20"/><path d="M20 5v6h-6"/></svg>
    </div>

    <div id="board-inner" class="board-inner">
      <header class="board-head">
        <button id="route-picker" class="route-btn" aria-expanded="false">
          <span class="route-title">
            <span id="route-name">Cargando…</span>
            <svg viewBox="0 0 24 24" class="chev"><path d="M6 9l6 6 6-6"/></svg>
          </span>
          <span id="route-ends" class="route-ends"></span>
        </button>
        <span id="freshness" class="age">—</span>
      </header>

      <!-- Se llena en 30 s: dice cuándo llega el dato siguiente sin leer -->
      <div class="tick" aria-hidden="true"><i id="tick"></i></div>

      <div id="alert-strip" class="alert-strip hidden"></div>
      <div id="legs" class="legs"></div>
      <p id="quota" class="quota"></p>
    </div>
  </main>
</section>

<!-- ============ LISTA DE RUTAS ============ -->
<section id="view-routes" class="view">
  <header class="bar">
    <h1>Mis rutas</h1>
    <button id="new-plan" class="bar-action">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>Nueva</span>
    </button>
  </header>
  <main class="scroll">
    <div id="routes-list"></div>
    <button id="new-route" class="link-btn">
      <svg viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M13.5 6.5l3 3"/></svg>
      Crear una ruta a mano, tramo a tramo
    </button>
  </main>
</section>

<!-- ============ PLANIFICADOR ============ -->
<section id="view-plan" class="view">
  <header class="bar">
    <h1>Buscar trayecto</h1>
  </header>

  <main class="scroll form">
    <div class="plan-fields">
      <div class="fld">
        <label for="plan-from"><span>Desde</span></label>
        <input id="plan-from" placeholder="Dirección o parada…" autocomplete="off">
        <div id="plan-from-res" class="stop-res"></div>
        <div id="plan-from-sel" class="chosen hidden"></div>
      </div>
      <div class="fld">
        <label for="plan-to"><span>Hasta</span></label>
        <input id="plan-to" placeholder="Dirección o parada…" autocomplete="off">
        <div id="plan-to-res" class="stop-res"></div>
        <div id="plan-to-sel" class="chosen hidden"></div>
      </div>
      <div class="fld">
        <span>Cuándo</span>
        <div id="plan-mode" class="segmented">
          <button type="button" data-mode="arrival" class="on">Llegar a las…</button>
          <button type="button" data-mode="departure">Salir a las…</button>
        </div>
      </div>
      <div class="fld narrow">
        <label for="plan-when"><span id="plan-when-lbl">A qué hora quieres llegar</span></label>
        <input id="plan-when" type="time" value="09:00">
      </div>
    </div>
    <button id="plan-go" class="primary wide">Ver opciones</button>
    <div id="plan-results"></div>
  </main>
</section>

<!-- ============ EDITOR ============ -->
<section id="view-editor" class="view">
  <header class="bar">
    <button class="icon-btn back" data-back="view-routes" aria-label="Volver">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="editor-title">Nueva ruta</h1>
  </header>

  <!-- Este formulario tiene pie propio, así que no reserva sitio para la
       barra de pestañas: aquí está escondida. -->
  <main class="scroll form has-foot">
    <div class="fld">
      <label for="f-name"><span>Nombre</span></label>
      <input id="f-name" placeholder="Casa → Trabajo" autocomplete="off">
    </div>

    <div class="fld">
      <span>Origen</span>
      <div class="stop-pick" data-role="origin">
        <input class="stop-q" placeholder="Buscar parada…" autocomplete="off">
        <div class="stop-results"></div>
        <div class="stop-chosen hidden"></div>
      </div>
    </div>

    <div class="fld">
      <span>Destino</span>
      <div class="stop-pick" data-role="dest">
        <input class="stop-q" placeholder="Buscar parada…" autocomplete="off">
        <div class="stop-results"></div>
        <div class="stop-chosen hidden"></div>
      </div>
    </div>

    <div class="fld">
      <span>Días</span>
      <div id="f-days" class="days"></div>
    </div>

    <div class="fld">
      <span>Horario</span>
      <div id="f-mode" class="segmented">
        <button type="button" data-mode="arrival">Llego a las…</button>
        <button type="button" data-mode="departure">Salgo a las…</button>
        <button type="button" data-mode="window">De… a…</button>
      </div>
    </div>

    <div class="fld row2" id="f-window">
      <label><span>Desde</span><input id="f-from" type="time" value="07:00"></label>
      <label><span>Hasta</span><input id="f-to" type="time" value="10:00"></label>
    </div>

    <div class="fld hidden" id="f-point">
      <label><span id="f-point-lbl">Hora</span>
        <input id="f-at" type="time" value="09:00"></label>
      <div class="hint" id="f-point-hint"></div>
    </div>

    <div class="fld">
      <span>Tramos <em>en orden, con los transbordos</em></span>
      <div id="legs-editor"></div>
      <button id="add-leg" class="ghost">+ Añadir tramo</button>
    </div>
  </main>

  <footer class="foot">
    <button id="del-route" class="danger hidden">Borrar</button>
    <span class="spacer"></span>
    <button id="save-route" class="primary">Guardar</button>
  </footer>
</section>

<!-- ============ ESTADÍSTICAS ============ -->
<section id="view-stats" class="view">
  <header class="bar">
    <h1>Historial</h1>
  </header>
  <main id="stats-body" class="scroll"></main>
</section>

<!-- Barra inferior: el pulgar llega aquí andando, a la esquina de arriba no. -->
<nav id="tabs" class="tabs">
  <button class="tab on" data-view="view-board" aria-label="Tablero">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
    <span>Tablero</span>
  </button>
  <button class="tab" data-view="view-routes" aria-label="Rutas">
    <svg viewBox="0 0 24 24"><path d="M6 20V7a3 3 0 0 1 6 0v10a3 3 0 0 0 6 0V4"/><circle cx="6" cy="20" r="1.6"/><circle cx="18" cy="4" r="1.6"/></svg>
    <span>Rutas</span>
  </button>
  <button class="tab" data-view="view-plan" aria-label="Buscar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.4-4.4"/></svg>
    <span>Buscar</span>
  </button>
  <button class="tab" data-view="view-stats" aria-label="Historial">
    <svg viewBox="0 0 24 24"><path d="M4 20V12M10 20V5M16 20v-6M22 20V9"/></svg>
    <span>Historial</span>
  </button>
</nav>

<script src="/static/app.js"></script>
</body>
</html>
